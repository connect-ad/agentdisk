name: Frontend web prod

# The customer dashboard SPA.
#
# Its own caller rather than one frontend workflow filtering on which
# app changed: this way GitHub does the path filtering natively, and an
# apps/admin push cannot redeploy this one. No diff logic to get wrong.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontend-web-prod.yml"
  # Every caller is dispatchable, so any one area can be redeployed on its own
  # without an empty commit. deploy-all-dev.yml drives all three in order.
  workflow_dispatch:

# Serialise deploys within an area, and never cancel one mid-flight: an
# interrupted run can leave Terraform state locked or a deploy half-applied.
#
# Each area has its OWN group rather than one shared group. GitHub keeps only
# one pending run per group, so sharing would let a burst of pushes silently
# drop a queued deploy - and a deploy that vanishes without failing is the
# outcome these pipelines exist to prevent.
concurrency:
  group: frontend-web-prod
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  run:
    uses: ./.github/workflows/frontend.yml
    with:
      app: web
      environment: prod
      label: Dashboard
    secrets: inherit
