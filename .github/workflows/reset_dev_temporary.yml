name: reset_dev_temporary

# TEMPORARY — delete this whole file when dev no longer needs rebuilding.
# Named with underscores, unlike every other workflow here, so it sorts and
# greps apart from the permanent pipelines and nobody has to work out whether
# it is load-bearing. Nothing references it; `git rm` is the entire removal.
#
# Destroys the dev environment and builds it back: R2 emptied, every Terraform
# resource destroyed, re-applied, then code, secrets and migrations redeployed.
# The fresh database gets its schema, its plan catalogue (migration 0012) and
# its first administrator (migration 0014) back on its own, so nothing
# has to be restored by hand.
#
# ── Why a tag and not a button ────────────────────────────────────────────
# `workflow_dispatch` only works if the workflow file is on the DEFAULT branch,
# and main is 225 commits behind dev with an older pipeline layout entirely —
# so a button here could not fire without first shipping a release. A tag push
# runs the workflow from the ref that carries the tag, so this works from dev
# with main never involved.
#
# The tag is also the confirmation. Nobody pushes `reset-dev-...` by accident,
# it names itself in the run list, and the tag list becomes a dated record of
# every rebuild.
#
# ── The guards ────────────────────────────────────────────────────────────
# This Cloudflare account also hosts a SECOND product line — amardrive-db-prod
# and amardrive-db-dev sit right beside agentdisk-dev-db. So the names are
# checked against what Terraform reports before anything is touched: the D1
# must end in -dev-db, the bucket in -dev-files, and neither may contain "prod"
# or "amardrive". The Terraform workspace is re-asserted after selection and
# again immediately before the destroy, because workspace selection is mutable
# CLI state and a stale one is the single way this layout can point dev intent
# at prod.
#
# R2 is emptied BEFORE the destroy, and that order is a hard requirement rather
# than hygiene: `cloudflare_r2_bucket` sets no force_destroy and Cloudflare
# refuses to delete a bucket holding objects, so a destroy over a populated
# bucket fails part-way through the stack.

on:
  push:
    tags:
      - "reset-dev-*"

concurrency:
  group: reset_dev_temporary
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  teardown:
    name: Tear down dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        shell: bash

    env:
      WORKSPACE: dev
      # The Terraform STATE credentials. Deliberately not the files-bucket
      # pair: confusing the two is the most dangerous mix-up in this repo, so
      # the files credential never enters the job environment and is bound only
      # in the single step that purges.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CF_ACCESS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CF_ZONE_ID }}
      TF_VAR_root_domain: ${{ vars.DOMAIN_NAME }}
      TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
      EXPECTED_D1_DATABASE: ${{ vars.D1_DATABASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.11"
          terraform_wrapper: false

      # Read the names BEFORE destroying anything — afterwards there are no
      # outputs left to read, and the purge needs the bucket name.
      - name: Read Terraform outputs
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # The endpoint is not optional. R2 is S3-compatible but is not AWS,
          # and without it Terraform talks to real S3, which rejects an R2 key
          # with "InvalidAccessKeyId: The AWS Access Key Id you provided does
          # not exist in our records" - an error that reads like a wrong secret
          # and is actually a wrong host. Written exactly the way infra.yml
          # writes it: two spellings of one backend config is how they drift.
          cat > backend.hcl <<EOF
          bucket = "${TFSTATE_BUCKET}"
          endpoints = {
            s3 = "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          }
          EOF

          terraform init -backend-config=backend.hcl -input=false
          terraform workspace select "$WORKSPACE"

          actual="$(terraform workspace show)"
          if [ "$actual" != "$WORKSPACE" ]; then
            echo "::error::Terraform is in workspace '$actual', expected '$WORKSPACE'."
            exit 1
          fi

          d1_name="$(terraform output -raw d1_database_name)"
          bucket="$(terraform output -raw r2_bucket_name)"
          account="$(terraform output -raw account_id)"

          echo "D1_NAME=$d1_name"    >> "$GITHUB_ENV"
          echo "R2_BUCKET=$bucket"   >> "$GITHUB_ENV"
          echo "R2_ACCOUNT=$account" >> "$GITHUB_ENV"

          # Masked before either can reach a log. `-raw` on an unset output
          # exits non-zero, so both tolerate failure and leave the purge step to
          # fall back on the environment secrets.
          r2_key="$(terraform output -raw r2_access_key_id 2>/dev/null || true)"
          r2_secret="$(terraform output -raw r2_secret_access_key 2>/dev/null || true)"
          if [ -n "$r2_key" ] && [ -n "$r2_secret" ]; then
            echo "::add-mask::$r2_key"
            echo "::add-mask::$r2_secret"
            echo "TF_R2_KEY=$r2_key"       >> "$GITHUB_ENV"
            echo "TF_R2_SECRET=$r2_secret" >> "$GITHUB_ENV"
          fi

      - name: Refuse anything that is not dev
        run: |
          set -euo pipefail

          if [ "$D1_NAME" != "$EXPECTED_D1_DATABASE" ]; then
            echo "::error::Terraform built D1 '$D1_NAME' but the dev environment expects '$EXPECTED_D1_DATABASE'."
            exit 1
          fi

          # Written out rather than loosened to a *dev* wildcard: a pattern
          # broad enough to survive a typo is broad enough to match something
          # nobody intended.
          case "$D1_NAME" in
            *-dev-db) ;;
            *) echo "::error::Refusing to destroy '$D1_NAME': only a -dev-db database."; exit 1 ;;
          esac

          case "$R2_BUCKET" in
            *-dev-files) ;;
            *) echo "::error::Refusing to purge '$R2_BUCKET': only a -dev-files bucket."; exit 1 ;;
          esac

          # The sibling product line lives in this same Cloudflare account.
          case "$D1_NAME$R2_BUCKET" in
            *prod*) echo "::error::'prod' appears in '$D1_NAME' / '$R2_BUCKET'. Refusing."; exit 1 ;;
          esac
          case "$D1_NAME$R2_BUCKET" in
            *amardrive*) echo "::error::'amardrive' appears in '$D1_NAME' / '$R2_BUCKET'. Refusing."; exit 1 ;;
          esac

          echo "Confirmed: destroying $D1_NAME and $R2_BUCKET in workspace $WORKSPACE."

      - name: Empty the files bucket
        env:
          SECRET_R2_KEY: ${{ secrets.R2_FILES_ACCESS_KEY_ID }}
          SECRET_R2_SECRET: ${{ secrets.R2_FILES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="${TF_R2_KEY:-$SECRET_R2_KEY}"
          export AWS_SECRET_ACCESS_KEY="${TF_R2_SECRET:-$SECRET_R2_SECRET}"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::No R2 credential for the files bucket. The destroy would fail on a non-empty bucket anyway."
            exit 1
          fi

          endpoint="https://$R2_ACCOUNT.r2.cloudflarestorage.com"
          aws s3 rm "s3://$R2_BUCKET" --recursive --endpoint-url "$endpoint"

          remaining="$(aws s3 ls "s3://$R2_BUCKET" --recursive --endpoint-url "$endpoint" | wc -l)"
          if [ "$remaining" != "0" ]; then
            echo "::error::$remaining object(s) still in $R2_BUCKET. The bucket destroy would fail; stopping before it does."
            exit 1
          fi
          echo "Bucket $R2_BUCKET is empty."

      - name: Destroy the dev stack
        working-directory: infra/terraform
        run: |
          set -euo pipefail

          # Re-asserted immediately before the destructive command, not only
          # after select. Nothing between them changes it, which is exactly why
          # the check is cheap enough to repeat.
          actual="$(terraform workspace show)"
          if [ "$actual" != "$WORKSPACE" ]; then
            echo "::error::Workspace drifted to '$actual' before destroy."
            exit 1
          fi

          terraform destroy -auto-approve -input=false -lock-timeout=5m

  # From here it is the ordinary build, in the order deploy-all-dev.yml uses.
  # Infrastructure first: after a destroy there are no outputs at all, and the
  # app pipelines read them.
  infra:
    name: Infrastructure
    needs: teardown
    uses: ./.github/workflows/infra.yml
    with:
      environment: dev
    secrets: inherit

  # Backend carries the D1 migrations, so the empty database gets its schema
  # back here.
  backend:
    name: Backend
    needs: infra
    uses: ./.github/workflows/backend.yml
    with:
      environment: dev
    secrets: inherit

  web:
    name: Dashboard
    needs: infra
    uses: ./.github/workflows/frontend.yml
    with:
      app: web
      environment: dev
      label: Dashboard
    secrets: inherit

  admin:
    name: Console
    needs: infra
    uses: ./.github/workflows/frontend.yml
    with:
      app: admin
      environment: dev
      label: Console
    secrets: inherit
