# Stripe plan catalogue — manual, and deliberately temporary.
#
# This is the one pipeline that creates and edits live billing objects. It is
# separate from infra.yml for the reasons in infra/stripe-catalogue/main.tf, and
# it is expected to be DELETED once the staff console can manage plans itself
# (14 PART 29.6). Deleting it means removing this file and that directory;
# nothing else in the repository depends on either.
#
# Three things make it different from every other pipeline here:
#
# **It never runs automatically.** No push trigger, no path filter, no call from
# deploy-all-dev.yml. Creating a price is not something a merge should do, and a
# pricing change is not something anybody should discover in a deploy log.
#
# **Plan and apply are separate runs, chosen by hand.** `plan` is the default,
# so the dangerous verb is never the one you get by pressing the button without
# reading it.
#
# **Apply cannot destroy.** `-refresh-only` is not enough and `prevent_destroy`
# lives in the config, but this adds the outer guard: the plan is written to a
# file, inspected for destroy actions, and the apply is refused if it finds any.
# A Stripe Price is referenced by live subscriptions; destroying one is a
# billing incident, not a rollback.

name: Stripe catalogue

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (selects the Stripe key: dev is test mode, prod is live mode)"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: "plan shows what would change; apply writes it to Stripe"
        required: true
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  # One run per environment. Two concurrent applies would contend for the state
  # lock anyway; this turns that into a queue rather than a failure.
  group: stripe-catalogue-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache

jobs:
  catalogue:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Scoped to the environment for two reasons: STRIPE_SECRET_KEY is an
    # environment secret, and prod's required-reviewer gate must block an apply
    # that creates live-mode prices until somebody approves it.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/stripe-catalogue
        shell: bash
    env:
      # State credentials are repository-level, shared with the main stack -
      # same bucket, different key.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

      # The billing credential. Per environment, never repository-wide: test
      # mode and live mode are separate object namespaces in Stripe, and that
      # separation is the only thing stopping a dev run from touching a real
      # price.
      STRIPE_API_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
      WORKSPACE: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Prepare provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-stripe-${{ runner.os }}-${{ hashFiles('infra/stripe-catalogue/.terraform.lock.hcl') }}
          restore-keys: tf-stripe-${{ runner.os }}-

      # Checked explicitly rather than left to fail inside Terraform. The Stripe
      # provider refreshes existing products to diff them, so a missing key
      # fails at PLAN with a provider authentication error that names no secret.
      # Prod has no STRIPE_SECRET_KEY set yet; stopping here is the intended
      # behaviour, and the message says what to do about it.
      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=""
          for name in STRIPE_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID TFSTATE_BUCKET; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets or variables for the $WORKSPACE environment:$missing"
            echo "STRIPE_API_KEY comes from the STRIPE_SECRET_KEY environment secret." >&2
            exit 1
          fi
          echo "All required secrets and variables are present."

      # A test-mode key starts sk_test_ / rk_test_; a live key does not. Getting
      # these the wrong way round would create the dev catalogue in live mode,
      # where prices cannot be deleted and `prevent_destroy` would then make the
      # mistake permanent. Cheap to check, expensive to discover afterwards.
      - name: Assert the key matches the environment's Stripe mode
        run: |
          set -euo pipefail
          case "$STRIPE_API_KEY" in
            sk_test_*|rk_test_*) mode="test" ;;
            sk_live_*|rk_live_*) mode="live" ;;
            *) echo "::error::STRIPE_API_KEY is not a recognised Stripe secret or restricted key."; exit 1 ;;
          esac
          if [ "$WORKSPACE" = "dev" ] && [ "$mode" != "test" ]; then
            echo "::error::The dev environment holds a $mode-mode Stripe key. Dev must use a test-mode key."
            exit 1
          fi
          if [ "$WORKSPACE" = "prod" ] && [ "$mode" != "live" ]; then
            echo "::error::The prod environment holds a $mode-mode Stripe key. Prod must use a live-mode key."
            exit 1
          fi
          echo "Stripe key mode confirmed: $mode"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Write Terraform backend config
        run: |
          set -euo pipefail
          cat > backend.hcl <<EOF
          bucket = "${TFSTATE_BUCKET}"
          endpoints = {
            s3 = "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          }
          EOF
          echo "State bucket: $TFSTATE_BUCKET (key: $WORKSPACE/stripe-catalogue.tfstate)"

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Select Terraform workspace
        run: terraform workspace select -or-create "$WORKSPACE"

      # Workspace selection is mutable CLI state, and here it carries more than
      # a resource prefix: it is the only record of whether this state describes
      # test-mode or live-mode Stripe objects.
      - name: Assert workspace
        run: |
          set -euo pipefail
          actual="$(terraform workspace show)"
          if [ "$actual" != "$WORKSPACE" ]; then
            echo "::error::Workspace is '$actual' but this job targets '$WORKSPACE'. Refusing to continue."
            exit 1
          fi
          echo "Workspace confirmed: $actual"

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # The outer destroy guard. `prevent_destroy` in the config already refuses
      # a destroy, but it refuses it at apply time, mid-run. This reads the plan
      # before anything is sent to Stripe and fails the job instead - and it
      # also catches a replacement, which is what a changed `unit_amount` looks
      # like and which prevent_destroy would only stop after the plan had
      # already been presented as reasonable.
      - name: Refuse any destroy or replacement
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json
          destroys="$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address + ": " + (.change.actions | join(","))' plan.json)"
          rm -f plan.json
          if [ -n "$destroys" ]; then
            echo "::error::This plan would destroy or replace live billing objects. Refusing."
            echo "$destroys"
            echo "A Stripe Price is immutable and is referenced by live subscriptions." >&2
            echo "To change an amount, add a new price and archive the old one -" >&2
            echo "see the rotation procedure in infra/stripe-catalogue/catalogue.tf." >&2
            exit 1
          fi
          echo "No destroys or replacements in this plan."

      - name: Summarise the plan
        run: |
          set -euo pipefail
          {
            echo "### Stripe catalogue — $WORKSPACE (${{ inputs.action }})"
            echo ""
            echo '```'
            terraform show -no-color tfplan | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # Names and IDs only. `terraform output -json` is avoided by habit across
      # this repository because it prints sensitive values in full; there are no
      # sensitive outputs here, but the habit is worth keeping.
      - name: Report the catalogue
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          reported="$(terraform output -raw environment)"
          if [ "$reported" != "$WORKSPACE" ]; then
            echo "::error::State reports environment '$reported', expected '$WORKSPACE'."
            exit 1
          fi
          {
            echo ""
            echo "#### Applied"
            echo '```'
            terraform output price_lookup_keys
            echo '```'
            echo "Run the catalogue sync so D1 picks up the price IDs:"
            echo '`POST /v1/staff/plans/sync`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "### Stripe catalogue ${{ inputs.action }} on $WORKSPACE FAILED" >> "$GITHUB_STEP_SUMMARY"
